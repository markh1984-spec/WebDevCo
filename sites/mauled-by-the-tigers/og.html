<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mauled by the Tigers share card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&display=block">
<style>
  /* Share card, drawn to fill the window at about 1.91:1 and captured as og.png */
  :root { --tiger: #ef6b1b; --tiger-deep: #cf5513; --ink: #15100c; --bone: #f4e9d6; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--tiger); color: var(--ink); overflow: hidden; position: relative; font-family: "Barlow", Arial, sans-serif; }
  svg.stripes { position: absolute; inset: 0; width: 100%; height: 100%; }
  .card { position: absolute; inset: 0; padding: 4.6vw 5.4vw; display: flex; flex-direction: column; justify-content: center; gap: 2.2vw; }
  .wordmark { font-family: "Big Shoulders Display", Impact, sans-serif; font-weight: 900; text-transform: uppercase; line-height: 0.8; margin: 0; font-size: 17vw; }
  .maul { position: relative; display: inline-block; }
  .rest { display: block; font-size: 0.35em; letter-spacing: 0.035em; line-height: 1; margin-top: 0.12em; }
  .claws { position: absolute; inset: -8% -4% -4% -4%; width: 108%; height: 112%; overflow: visible; }
  .claws path { fill: none; stroke: var(--tiger); stroke-width: 0.07em; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 3vw; }
  .lede { font-size: 2.5vw; font-weight: 500; margin: 0; max-width: 34ch; line-height: 1.3; }
  .url { font-family: "Big Shoulders Display", Impact, sans-serif; font-weight: 800; font-size: 2.3vw; letter-spacing: 0.06em; text-transform: uppercase; background: var(--ink); color: var(--bone); padding: 0.6vw 1.4vw; border-radius: 99px; white-space: nowrap; }
</style>
</head>
<body>
<svg class="stripes" id="stripes" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"></svg>
<div class="card">
  <h1 class="wordmark">
    <span class="maul">Mauled
      <svg class="claws" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <path d="M30 -2 Q40 50 52 104"/><path d="M45 -4 Q55 48 67 103"/><path d="M60 -2 Q70 50 82 104"/>
      </svg>
    </span>
    <span class="rest">by the Tigers</span>
  </h1>
  <div class="foot">
    <p class="lede">Two grown adults in tiger suits play console football, live.</p>
    <span class="url">mauledbythetigers.co.uk</span>
  </div>
</div>
<script>
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function wedge(edge, pos, width, len, drift) {
  const a = pos - width / 2, b = pos + width / 2, W = 1000;
  if (edge === "right") return `M${W},${a} Q${W - len * 0.55},${a + drift * 0.4} ${W - len},${pos + drift} Q${W - len * 0.5},${b + drift * 0.7} ${W},${b} Z`;
  return `M0,${a} Q${len * 0.55},${a + drift * 0.4} ${len},${pos + drift} Q${len * 0.5},${b + drift * 0.7} 0,${b} Z`;
}
const r = rng(7), out = [];
for (let i = 0; i < 9; i++) out.push(wedge("right", 60 + i * 112 + r() * 30, 34 + r() * 40, 160 + r() * 260, (r() - 0.5) * 120));
for (let i = 0; i < 5; i++) out.push(wedge("left", 120 + i * 190 + r() * 40, 24 + r() * 26, 30 + r() * 50, (r() - 0.5) * 50));
document.getElementById("stripes").innerHTML = out.map(d => `<path d="${d}" fill="#cf5513"/>`).join("");
</script>
</body>
</html>
